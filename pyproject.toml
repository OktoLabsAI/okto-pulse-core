[project]
name = "okto-pulse-core"
version = "0.3.3"
description = "Okto Pulse Core - transport-neutral domain and application engine"
requires-python = ">=3.11"
license = {text = "Elastic-2.0"}
authors = [
    {name = "Okto Labs", email = "dev@oktolabs.ai"},
]
keywords = ["kanban", "project-management", "mcp", "ai-agents", "spec-driven"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Quality Assurance",
    "Topic :: Office/Business :: Scheduling",
    "Operating System :: OS Independent",
]
dependencies = [
    "pydantic>=2.12.0,<2.14",
    # Imported directly for transport-safe custom validation errors. Pydantic
    # itself pins the exact compatible engine release within this range.
    "pydantic-core>=2.14.1,<3.0.0",
    # Python 3.11 requires the backported TypedDict implementation for
    # Pydantic-compatible runtime schema materialization.
    "typing-extensions>=4.14.1,<5.0.0",
    "PyYAML>=6.0.0,<7.0.0",
]

[project.optional-dependencies]
dev = [
    "aiosqlite>=0.19.0,<1.0.0",
    "build>=1.2.0,<2.0.0",
    # The standard Core fixtures exercise the Community-owned local persistence
    # and graph adapters. Keep that edition in the development path only.
    "okto-pulse>=0.3.3,<1.0.0",
    "pyright>=1.1.390,<2.0.0",
    "pytest>=8.0.0,<10.0.0",
    "pytest-asyncio>=0.24.0,<2.0.0",
    "ruff>=0.9.0,<1.0.0",
    "SQLAlchemy[asyncio]==2.0.49",
]

[project.scripts]
# spec #12 (tr_b5f136b3): CI-runnable core-pure boundary auditor. Static
# analysis only (ast/tomllib/pathlib) — no runtime side effects on import.
okto-pulse-core-boundary = "okto_pulse.core.application.boundary.cli:main"

[project.urls]
Homepage = "https://github.com/OktoLabsAI/okto-pulse-core"
Documentation = "https://docs.oktolabs.ai/"
Repository = "https://github.com/OktoLabsAI/okto-pulse-core"
Issues = "https://github.com/OktoLabsAI/okto-pulse-core/issues"

[project.readme]
file = "README.md"
content-type = "text/markdown"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/okto_pulse"]

[tool.hatch.build.targets.wheel.force-include]
"src/okto_pulse/core/mcp/agent_instructions.md" = "okto_pulse/core/mcp/agent_instructions.md"
"src/okto_pulse/core/application/processors/tech_entities.yml" = "okto_pulse/core/application/processors/tech_entities.yml"
"src/okto_pulse/core/kg/agent/prompts/cognitive_agent_v1.md" = "okto_pulse/core/kg/agent/prompts/cognitive_agent_v1.md"
"src/okto_pulse/core/mcp/resources/workflows/stories.md" = "okto_pulse/core/mcp/resources/workflows/stories.md"
"src/okto_pulse/core/mcp/resources/workflows/ideations.md" = "okto_pulse/core/mcp/resources/workflows/ideations.md"
"src/okto_pulse/core/mcp/resources/workflows/refinements.md" = "okto_pulse/core/mcp/resources/workflows/refinements.md"
"src/okto_pulse/core/mcp/resources/workflows/specs.md" = "okto_pulse/core/mcp/resources/workflows/specs.md"
"src/okto_pulse/core/mcp/resources/workflows/cards.md" = "okto_pulse/core/mcp/resources/workflows/cards.md"
"src/okto_pulse/core/mcp/resources/workflows/sprints.md" = "okto_pulse/core/mcp/resources/workflows/sprints.md"
"src/okto_pulse/core/mcp/resources/workflows/kg.md" = "okto_pulse/core/mcp/resources/workflows/kg.md"
"src/okto_pulse/core/mcp/resources/reference/errors.md" = "okto_pulse/core/mcp/resources/reference/errors.md"
"src/okto_pulse/core/mcp/resources/reference/multivalue.md" = "okto_pulse/core/mcp/resources/reference/multivalue.md"
"src/okto_pulse/core/mcp/resources/reference/destructive_ops.md" = "okto_pulse/core/mcp/resources/reference/destructive_ops.md"
"src/okto_pulse/core/mcp/resources/reference/card_types.md" = "okto_pulse/core/mcp/resources/reference/card_types.md"
"src/okto_pulse/core/mcp/resources/reference/spec_gates.md" = "okto_pulse/core/mcp/resources/reference/spec_gates.md"
"src/okto_pulse/core/mcp/resources/reference/policy-compliance.md" = "okto_pulse/core/mcp/resources/reference/policy-compliance.md"
"src/okto_pulse/core/mcp/resources/reference/project_structure.md" = "okto_pulse/core/mcp/resources/reference/project_structure.md"
"src/okto_pulse/core/mcp/resources/reference/examples/semantic-guideline-assessment-v1.json" = "okto_pulse/core/mcp/resources/reference/examples/semantic-guideline-assessment-v1.json"
"src/okto_pulse/core/mcp/resources/reference/examples/semantic-guideline-assessment-v2.json" = "okto_pulse/core/mcp/resources/reference/examples/semantic-guideline-assessment-v2.json"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
# Function scope exposes loop-bound fixture leaks instead of letting them
# survive until the session loop is closed.  The schema bootstrap fixture
# `_db_init` declares its required session loop explicitly in tests/conftest.py.
asyncio_default_fixture_loop_scope = "function"
markers = [
    "e2e: end-to-end pipeline contract tests — slow, open Kùzu handles, exercise outbox worker; excluded by the fast unit run via `pytest -m 'not e2e'`",
    "real_kg: integration tests that exercise the real LadybugDB/KG backend",
    "timeout(seconds): override per-test timeout (default 120s)",
    "stress: KG-01.6 destructive stress profile — opt-in slow tests that drive KGChaosExecutor against the primitives for release evidence; excluded by default via `pytest -m 'not stress'`. Run with `pytest -m stress` or `python scripts/run_kg_ci_destructive_stress.py`.",
]
