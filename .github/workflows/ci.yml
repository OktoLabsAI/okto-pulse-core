name: CI

# Lightweight CI for okto-pulse-core (the engine library).
#
# Aligned with the project's testing methodology: behavioral correctness is
# gated by the okto-pulse release pipeline (Docker smoke + MCP replay), not
# by repeating brittle unit tests across an OS×Python matrix that don't
# reflect what we actually ship.
#
# This workflow only verifies that the package is well-formed:
#   - imports cleanly
#   - lints clean
#   - type-checks clean
#   - builds a distributable wheel
#   - has no security/license/secret regressions
#
# Single runner (ubuntu-latest), single Python (3.12 — the version pulse's
# Docker image ships with; the codebase uses PEP 701 nested f-strings which
# require 3.12+, so older Pythons are not a target).

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-lint:
    name: lint + typecheck + build
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v6

      - name: Set up Python 3.12
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: pyproject.toml

      # The dev extra pins okto-pulse (Community) at the same minor as this
      # Core, but Core is always published to PyPI *before* Community, so
      # `pip install -e ".[dev]"` cannot resolve that pin from PyPI during a
      # release promotion. Resolve Community from git instead, mirroring the
      # sibling-branch policy okto-pulse's CI uses for Core: prefer a Community
      # branch with the same name as this PR/branch, fall back to main.
      - name: Determine matching okto-pulse branch
        id: community_ref
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Pass branch name through env var instead of inline interpolation
          # to avoid script-injection via attacker-controlled branch names.
          BRANCH: ${{ github.head_ref || github.ref_name }}
        run: |
          if gh api "repos/OktoLabsAI/okto-pulse/branches/${BRANCH}" --silent 2>/dev/null; then
            echo "Using matching okto-pulse branch: ${BRANCH}"
            echo "ref=${BRANCH}" >> "$GITHUB_OUTPUT"
          else
            echo "No matching okto-pulse branch (${BRANCH}), falling back to main"
            echo "ref=main" >> "$GITHUB_OUTPUT"
          fi

      - name: Install package + tooling
        env:
          COMMUNITY_REF: ${{ steps.community_ref.outputs.ref }}
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]" \
            "okto-pulse @ git+https://github.com/OktoLabsAI/okto-pulse.git@${COMMUNITY_REF}"

      - name: Check local Markdown links
        run: python scripts/check_markdown_links.py

      - name: Import smoke test
        run: |
          python -c "import okto_pulse.core; print('package imports cleanly')"

      - name: MCP permission registry gate
        run: |
          python scripts/validate_mcp_permission_registry.py
          python -m pytest --noconftest -q \
            tests/test_mcp_permission_registry.py \
            tests/test_mcp_gap_core_authorization.py

      - name: Lint (ruff, advisory)
        # Advisory: there are ~145 pre-existing lint findings (mostly
        # E712 == False comparisons in SQLAlchemy where conditions, where
        # `is False` would change semantics, plus a few F841 unused
        # locals). Promote to strict once those are triaged.
        continue-on-error: true
        run: ruff check src/

      - name: Type check (pyright, advisory)
        # Advisory: the codebase has type debt being worked through.
        # Strict gate gets reinstated once clean.
        continue-on-error: true
        run: pyright src/

      - name: Build distributable wheel
        run: python -m build

      - name: Verify wheel installs into a clean env
        run: |
          python -m venv /tmp/wheel-check-env
          /tmp/wheel-check-env/bin/pip install dist/*.whl
          /tmp/wheel-check-env/bin/pip install pytest pytest-asyncio
          cd /tmp
          /tmp/wheel-check-env/bin/python - <<'PY'
          import importlib
          import pkgutil
          import sys
          import okto_pulse.core

          forbidden = ("fastapi", "starlette", "sqlalchemy", "aiosqlite", "okto_pulse.community")
          modules = []
          for item in pkgutil.walk_packages(
              okto_pulse.core.__path__, okto_pulse.core.__name__ + "."
          ):
              importlib.import_module(item.name)
              modules.append(item.name)
          bad = sorted(
              name for name in sys.modules
              if any(name == token or name.startswith(token + ".") for token in forbidden)
          )
          assert not bad, bad
          print(f"core-wheel-imports={len(modules)} forbidden-loaded=0")
          PY
          /tmp/wheel-check-env/bin/python -m pytest --noconftest -q \
            "$GITHUB_WORKSPACE/tests/test_f01_repository_domain_ports.py" \
            "$GITHUB_WORKSPACE/tests/test_f02_fake_saas_uow.py" \
            "$GITHUB_WORKSPACE/tests/test_f02_uow_session_boundary.py" \
            "$GITHUB_WORKSPACE/tests/test_f03_realm_scope_contract.py" \
            "$GITHUB_WORKSPACE/tests/test_f05_card_transition_policy.py" \
            "$GITHUB_WORKSPACE/tests/test_f05_domain_event_delivery.py" \
            "$GITHUB_WORKSPACE/tests/test_f05_queue_health_policy.py" \
            "$GITHUB_WORKSPACE/tests/test_f05_service_ownership.py" \
            "$GITHUB_WORKSPACE/tests/test_f05_spec_materialization_policy.py" \
            "$GITHUB_WORKSPACE/tests/test_f06_rebuild_processor.py" \
            "$GITHUB_WORKSPACE/tests/test_f09_graph_neutral_ports.py" \
            "$GITHUB_WORKSPACE/tests/test_f10_worker_processor_boundary.py" \
            "$GITHUB_WORKSPACE/tests/test_f11_telemetry_edition_boundary.py" \
            "$GITHUB_WORKSPACE/tests/test_f12_thin_inbound_boundaries.py" \
            "$GITHUB_WORKSPACE/tests/test_f15_persistence_edition_gate.py" \
            "$GITHUB_WORKSPACE/tests/test_f16_saas_closure_report.py" \
            "$GITHUB_WORKSPACE/tests/test_public_contract_manifest.py"

  security:
    name: security + license
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v6

      - name: Set up Python 3.12
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Install package
        run: pip install -e .

      - name: Dependency audit (advisory)
        continue-on-error: true
        run: |
          pip install pip-audit
          pip-audit

      - name: License compliance
        run: |
          pip install pip-licenses
          pip-licenses --fail-on="GNU General Public License v2 (GPLv2);GNU General Public License v3 (GPLv3);GNU Affero General Public License v3 (AGPLv3)"

      - name: Secret scan
        # Pinned to commit SHA for supply-chain integrity (audit C1).
        # SHA below is v3.95.2 (released 2026-04-21). When bumping, update
        # both the SHA and the trailing version comment together.
        uses: trufflesecurity/trufflehog@17456f8c7d042d8c82c9a8ca9e937231f9f42e26 # v3.95.2
        with:
          extra_args: --only-verified
